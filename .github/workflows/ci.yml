name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: tests must pass and the CLI must bundle/compile.
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build CLI
        run: bun run build

  # Informational only (not blocking): the reconstructed source currently has a
  # large pre-existing type-error baseline under a non-strict config. This job
  # surfaces the count so it can be driven down over time toward `strict: true`.
  typecheck:
    name: Typecheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: |
          echo "Pre-existing type-error baseline (non-blocking):"
          bunx tsc --noEmit 2>&1 | grep -c 'error TS' || true
          bunx tsc --noEmit
